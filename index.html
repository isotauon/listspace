<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>ephemeral list</title>
	<meta name="description" content="an ephemeral list">
	<meta name="theme-color" content="#0a0a0b">
	<meta name="color-scheme" content="dark">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="ephemeral">
	<link rel="icon" href="/icon-192.png" type="image/png">
	<link rel="apple-touch-icon" href="/icon-192.png">
	<link rel="manifest" href="/manifest.json">
	<style>
	/* every look below reads a variable; the tune panel moves them and keeps them */
	:root { --size: 14; --weight: 200; --title: 25; --line: .75; --check: 14; --row: 42; --corner: 19; --frost: 10; --glass: .3; --stars: 1; --starsize: 1; --shine: 1; --twinkle: 1; --dust: 1; --drift: 1; --dustlife: 1; --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
		--night: #0a0a0b; --edge: rgba(255,255,255,.08); --ink: #f0f0f0; --ink-soft: rgba(240,240,240,.46); --accent: #f2f2f2; }
	* { box-sizing: border-box; }
	html, body { margin: 0; min-height: 100%; }
	body { background: var(--night); color: var(--ink); font-family: var(--font); font-size: calc(var(--size) * 1px); font-weight: var(--weight); line-height: 1.4; letter-spacing: -.005em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; -webkit-tap-highlight-color: transparent; }
	#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
	main { width: min(460px, 100%); margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: calc(32px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
	header { display: flex; align-items: center; gap: 14px; padding: 0 4px 0 6px; }
	h1 { margin: 0; flex: 1; font-size: calc(var(--title) * 1px); font-weight: calc(var(--weight) - 50); letter-spacing: -.025em; line-height: 1; }
	#count { font-size: calc(var(--title) * .6px); font-weight: calc(var(--weight) - 50); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
	.icon { width: 36px; height: 36px; display: grid; place-items: center; border: 0; padding: 0; background: none; color: var(--ink-soft); border-radius: 50%; cursor: pointer; transition: color .15s, background .15s; }
	.icon:hover, .icon[aria-expanded="true"] { color: var(--ink); background: rgba(255,255,255,.06); }
	.icon circle { fill: var(--night); }
	.icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: calc(var(--line) * 1.25); stroke-linecap: round; }
	.group { background: rgba(30,30,32,var(--glass)); border: 1px solid var(--edge); border-radius: calc(var(--corner) * 1px); backdrop-filter: blur(calc(var(--frost) * 1px)) saturate(1.3); -webkit-backdrop-filter: blur(calc(var(--frost) * 1px)) saturate(1.3); overflow: hidden; }
	#list { list-style: none; margin: 0; padding: 0; }
	/* a hairline between rows, starting where the text starts */
	.item, #add { position: relative; }
	.item + .item::before, #list:not(:empty) + #add::before { content: ''; position: absolute; top: 0; left: calc(var(--check) * 1px + 32px); right: 0; height: 1px; background: var(--edge); }
	.item { display: flex; transition: opacity .25s, transform .25s; }
	.item label { position: relative; display: flex; align-items: center; gap: 16px; flex: 1; min-height: calc(var(--row) * 1px); padding: 12px 16px; cursor: pointer; }
	.item input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
	/* the check: a hairline ring, then a filled circle with the mark drawn in */
	.box { flex: none; width: calc(var(--check) * 1px); height: calc(var(--check) * 1px); border: calc(var(--line) * 1px) solid rgba(240,240,240,.4); border-radius: 50%; display: grid; place-items: center; transition: background .2s, border-color .2s, transform .2s; }
	.item label:hover .box { border-color: var(--accent); }
	.box svg { width: 55%; height: 55%; stroke: var(--night); stroke-width: calc(var(--line) * 2); stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .22s ease-out .05s; }
	.text { flex: 1; min-width: 0; overflow-wrap: anywhere; transition: color .25s; }
	.item.done .box { background: var(--accent); border-color: var(--accent); }
	.item.done .box svg { stroke-dashoffset: 0; }
	.item.done .text { color: var(--ink-soft); }
	/* leaving: the row fades as its stars lift off, then closes up */
	.item.gone { opacity: 0; filter: blur(3px); height: 0 !important; overflow: hidden; transition: opacity .35s, filter .35s, height .3s ease-in-out .3s; }
	#dust { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
	.item.dragging { opacity: .4; }
	.item[draggable="true"] { cursor: grab; }
	.item:has(input:focus-visible) { outline: 1px solid var(--accent); outline-offset: -1px; border-radius: calc(var(--corner) * 1px); }
	/* the field is the last row, its text where the items' text starts; enter adds */
	#add { display: flex; align-items: center; min-height: calc(var(--row) * 1px); padding: 0 16px 0 calc(var(--check) * 1px + 32px); }
	#task { flex: 1; min-width: 0; height: calc(var(--row) * 1px); border: 0; background: none; color: var(--ink); font: inherit; padding: 0; }
	#task:focus-visible { outline: none; }
	#task::placeholder { color: var(--ink-soft); }
	/* the tune panel */
	#tune { position: fixed; z-index: 5; top: calc(16px + env(safe-area-inset-top)); right: 16px; width: 280px; max-height: calc(100dvh - 32px); overflow: auto; padding: 14px 16px 16px; background: rgba(22,22,24,.82); border: 1px solid var(--edge); border-radius: 16px; backdrop-filter: blur(24px) saturate(1.3); -webkit-backdrop-filter: blur(24px) saturate(1.3); box-shadow: 0 20px 50px rgba(0,0,0,.4); font-size: 13px; font-weight: 400; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
	#tune[hidden] { display: none; }
	#tune label { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; padding: 6px 0; color: var(--ink-soft); }
	#tune output { color: var(--ink); font-variant-numeric: tabular-nums; }
	#tune input { grid-column: 1 / -1; width: 100%; margin: 6px 0 0; -webkit-appearance: none; appearance: none; height: 18px; background: none; cursor: pointer; }
	#tune input::-webkit-slider-runnable-track { height: 1px; background: rgba(255,255,255,.22); }
	#tune input::-moz-range-track { height: 1px; background: rgba(255,255,255,.22); }
	#tune input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6.5px; border-radius: 50%; background: var(--ink); border: 0; }
	#tune input::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 0; }
	#tune input:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
	.seg { display: flex; gap: 4px; padding: 6px 0 4px; }
	.seg button, .foot button { flex: 1; height: 32px; border: 1px solid var(--edge); border-radius: 9px; background: none; color: var(--ink-soft); font: inherit; cursor: pointer; }
	.seg button[aria-pressed="true"] { color: var(--ink); border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.06); }
	.foot { display: flex; gap: 4px; margin-top: 10px; }
	.seg button:hover, .foot button:hover { color: var(--ink); }
	@media (hover: none) {
		/* a phone: the title at the top, the list under it, the field its last row */
		main { justify-content: flex-start; }
		/* 16px keeps the phone from zooming in on the field */
		#task { font-size: max(16px, 1em); height: max(48px, calc(var(--row) * 1px)); }
		.item label { min-height: max(44px, calc(var(--row) * 1px)); }
		#tune { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 72dvh; border-radius: 20px 20px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
		#tune label { padding: 8px 0; }
		#tune input { height: 28px; }
		#tune input::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -10.5px; }
		#tune input::-moz-range-thumb { width: 22px; height: 22px; }
		.seg button, .foot button { height: 40px; }
	}
	@media (prefers-reduced-motion: reduce) { .item, .box, .box svg, .text, .icon { transition: none; } }
	</style>
</head>
<body>
	<canvas id="sky" aria-hidden="true"></canvas>
	<main>
		<header><h1>list</h1><span id="count" aria-label="open"></span></header>
		<div class="group">
			<ul id="list" aria-label="list"></ul>
			<form id="add" autocomplete="off">
				<input id="task" type="text" placeholder="new" aria-label="item" maxlength="140" autocapitalize="sentences" enterkeyhint="enter" autocomplete="off">
			</form>
		</div>
	</main>
	<section id="tune" aria-label="tune" hidden></section>
	<script>
	(function () {
	'use strict';
	var REDUCED = false, HOVER = false;
	try { REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches; HOVER = matchMedia('(hover: hover)').matches; } catch (e) {}
	var list = document.getElementById('list'), form = document.getElementById('add'), field = document.getElementById('task');

	// ---------- the list: it lives as long as the tab does ----------
	var KEY = 'ephemeral-list';
	function items() { return Array.prototype.map.call(list.querySelectorAll('.item:not(.done)'), function (li) { return li.querySelector('.text').textContent; }); }
	function save() { var n = items().length; document.getElementById('count').textContent = n || ''; try { sessionStorage.setItem(KEY, JSON.stringify(items())); } catch (e) {} }
	function add(text) {
		var li = document.createElement('li'); li.className = 'item';
		var label = document.createElement('label');
		var box = document.createElement('input'); box.type = 'checkbox';
		var mark = document.createElement('span'); mark.className = 'box';
		mark.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
		var span = document.createElement('span'); span.className = 'text'; span.textContent = text;
		label.appendChild(box); label.appendChild(mark); label.appendChild(span); li.appendChild(label);
		if (HOVER) li.draggable = true;
		// checked: the mark draws and the line strikes through; a moment later the row leaves.
		// unchecking inside that moment keeps it
		var timer = null;
		box.addEventListener('change', function () {
			li.classList.toggle('done', box.checked);
			clearTimeout(timer);
			if (box.checked) timer = setTimeout(function () {
				if (REDUCED) { li.remove(); save(); return; }
				scatter(span);
				li.style.height = li.offsetHeight + 'px';
				li.offsetHeight;
				li.classList.add('gone');
				setTimeout(function () { li.remove(); save(); }, 640);
			}, 1600);
			save();
		});
		list.appendChild(li);
		return li;
	}
	form.addEventListener('submit', function (e) {
		e.preventDefault();
		var t = field.value.trim();
		if (t === '/tune') { field.value = ''; open(true); return; }
		if (!t) return;
		add(t);
		field.value = '';
		field.focus();
		save();
	});
	try { (JSON.parse(sessionStorage.getItem(KEY)) || []).forEach(add); } catch (e) {}
	save();
	// a keyboard is already there on a desk; on a phone the keyboard waits for a tap
	if (HOVER) field.focus();


	// ---------- tune: sliders over the variables in :root, kept in this browser ----------
	var TUNE = [['text', 'size', 14, 22, 1, 'px'], ['weight', 'weight', 200, 600, 50, ''], ['title', 'title', 20, 48, 1, 'px'], ['line', 'line', .5, 2.5, .25, 'px'], ['check', 'check', 14, 28, 1, 'px'], ['row', 'row', 40, 68, 2, 'px'], ['corners', 'corner', 0, 28, 1, 'px'], ['frost', 'frost', 0, 40, 1, 'px'], ['glass', 'glass', 0, 1, .05, ''], ['stars', 'stars', 0, 3, .1, '×'], ['star size', 'starsize', .3, 3, .1, '×'], ['shine', 'shine', 0, 1.5, .05, '×'], ['twinkle', 'twinkle', 0, 3, .1, '×'], ['dust', 'dust', 0, 3, .1, '×'], ['drift', 'drift', 0, 3, .1, '×'], ['dust life', 'dustlife', .3, 3, .1, '×']];
	var FONTS = { sans: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif", serif: "ui-serif, 'New York', 'Iowan Old Style', Georgia, serif", round: "ui-rounded, 'SF Pro Rounded', system-ui, sans-serif", mono: "ui-monospace, 'SF Mono', Menlo, monospace" };
	var skyDraw = null;
	var TK = 'ls-tune', root = document.documentElement, base = getComputedStyle(root), DEF = {}, tuned = {};
	TUNE.forEach(function (r) { DEF[r[1]] = parseFloat(base.getPropertyValue('--' + r[1])); });
	DEF.font = 'sans';
	try { tuned = JSON.parse(localStorage.getItem(TK)) || {}; } catch (e) {}
	function val(k) { return k in tuned ? tuned[k] : DEF[k]; }
	function apply() { TUNE.forEach(function (r) { root.style.setProperty('--' + r[1], val(r[1])); }); root.style.setProperty('--font', FONTS[val('font')] || FONTS.sans); if (skyDraw) skyDraw(); }
	function keep() { try { localStorage.setItem(TK, JSON.stringify(tuned)); } catch (e) {} }
	apply();
	var panel = document.getElementById('tune'), back = null;
	function build() {
		panel.innerHTML = '';
		var seg = document.createElement('div'); seg.className = 'seg'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', 'font');
		Object.keys(FONTS).forEach(function (f) {
			var b = document.createElement('button'); b.type = 'button'; b.textContent = f; b.style.fontFamily = FONTS[f];
			b.setAttribute('aria-pressed', val('font') === f);
			b.addEventListener('click', function () { tuned.font = f; apply(); keep(); seg.querySelectorAll('button').forEach(function (o) { o.setAttribute('aria-pressed', o === b); }); });
			seg.appendChild(b);
		});
		panel.appendChild(seg);
		TUNE.forEach(function (r) {
			var l = document.createElement('label'), o = document.createElement('output'), i = document.createElement('input');
			i.type = 'range'; i.min = r[2]; i.max = r[3]; i.step = r[4]; i.value = val(r[1]);
			function show() { o.textContent = +(+i.value).toFixed(2) + r[5]; }
			show();
			i.addEventListener('input', function () { tuned[r[1]] = +i.value; apply(); show(); keep(); });
			i.addEventListener('change', keep);
			l.appendChild(document.createTextNode(r[0])); l.appendChild(o); l.appendChild(i); panel.appendChild(l);
		});
		var reset = document.createElement('button'); reset.id = 'reset'; reset.type = 'button'; reset.textContent = 'reset';
		reset.addEventListener('click', function () { tuned = {}; keep(); apply(); build(); reset = panel.querySelector('#reset'); reset && reset.focus(); });
		var copy = document.createElement('button'); copy.type = 'button'; copy.textContent = 'copy';
		copy.addEventListener('click', function () { var t = JSON.stringify(tuned); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { copy.textContent = 'copied'; }, function () { copy.textContent = t; }); });
		var foot = document.createElement('div'); foot.className = 'foot'; foot.appendChild(copy); foot.appendChild(reset);
		panel.appendChild(foot);
	}
	function open(on) {
		if (on !== panel.hidden) return;
		if (on) { back = document.activeElement; build(); }
		panel.hidden = !on;
		if (on) panel.querySelector('button').focus(); else if (back && back.focus) back.focus();
	}
	// no button: shift with option, control or command, then comma; or type /tune in the field
	document.addEventListener('keydown', function (e) {
		if (e.key === 'Escape' && !panel.hidden) open(false);
		else if (e.code === 'Comma' && e.shiftKey && (e.altKey || e.ctrlKey || e.metaKey)) { e.preventDefault(); open(panel.hidden); }
	}, true);
	document.addEventListener('pointerdown', function (e) { if (!panel.hidden && !panel.contains(e.target)) open(false); });

	// ---------- reorder by dragging, where there is a mouse ----------
	var dragging = null;
	list.addEventListener('dragstart', function (e) {
		dragging = e.target.closest ? e.target.closest('.item') : null;
		if (!dragging) return;
		dragging.classList.add('dragging');
		e.dataTransfer.effectAllowed = 'move';
		e.dataTransfer.setData('text/plain', dragging.querySelector('.text').textContent);
	});
	list.addEventListener('dragend', function () { if (dragging) dragging.classList.remove('dragging'); dragging = null; save(); });
	list.addEventListener('dragover', function (e) {
		if (!dragging) return;
		e.preventDefault();
		var kids = list.querySelectorAll('.item:not(.dragging)'), after = null;
		for (var i = 0; i < kids.length; i++) { var b = kids[i].getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) { after = kids[i]; break; } }
		if (after) list.insertBefore(dragging, after); else list.appendChild(dragging);
	});

	// ---------- the sky: stars on one canvas, twinkling off the clock ----------
	var sky = document.getElementById('sky'), sc = sky.getContext('2d'), stars = [], W = 0, H = 0;
	for (var i = 0; i < 1400; i++) stars.push({ x: Math.random(), y: Math.random(), r: Math.random() < .3 ? 1.2 : .7, a: .35 + Math.random() * .5, tw: Math.random() < .5 ? .6 + Math.random() * 1.2 : 0, ph: Math.random() * 6.2832 });
	function size() {
		var dpr = Math.min(window.devicePixelRatio || 1, 2);
		W = window.innerWidth; H = window.innerHeight;
		sky.width = Math.round(W * dpr); sky.height = Math.round(H * dpr);
		sc.setTransform(dpr, 0, 0, dpr, 0, 0);
		draw(performance.now() / 1000);
	}
	function draw(t) {
		sc.clearRect(0, 0, W, H);
		sc.fillStyle = '#fff';
		// stars left behind by finished items, where they came to rest
		var size = val('starsize'), shine = val('shine'), tw = REDUCED ? 0 : val('twinkle');
		for (var j = 0; j < born.length; j++) { var bs = born[j]; sc.globalAlpha = Math.min(1, shine * bs.a * (0.6 + 0.4 * Math.sin(t * bs.tw * tw + bs.ph))); sc.beginPath(); sc.arc(bs.x * W, bs.y * H, bs.r * size, 0, 6.2832); sc.fill(); }
		sc.fillStyle = '#fff';
		// about one star per 6000 square px, whatever the screen
		var n = Math.min(stars.length, Math.round(W * H / 6000 * val('stars')));
		for (var i = 0; i < n; i++) {
			var s = stars[i];
			sc.globalAlpha = Math.min(1, shine * (s.tw && tw ? s.a * (0.6 + 0.4 * Math.sin(t * s.tw * tw + s.ph)) : s.a));
			sc.beginPath(); sc.arc(s.x * W, s.y * H, s.r * size, 0, 6.2832); sc.fill();
		}
		sc.globalAlpha = 1;
	}
	var raf = 0, last = 0;
	skyDraw = function () { draw(performance.now() / 1000); };

	// ---------- a finished item comes apart into stars ----------
	// each grain starts on a line of the text and drifts up off the clock; a few stay in the sky
	var born = [], grains = [], dust = null, dc = null, draf = 0;
	function scatter(el) {
		if (!dust) { dust = document.createElement('canvas'); dust.id = 'dust'; dust.setAttribute('aria-hidden', 'true'); document.body.appendChild(dust); dc = dust.getContext('2d'); }
		var dpr = Math.min(window.devicePixelRatio || 1, 2);
		if (dust.width !== Math.round(W * dpr) || dust.height !== Math.round(H * dpr)) { dust.width = Math.round(W * dpr); dust.height = Math.round(H * dpr); dc.setTransform(dpr, 0, 0, dpr, 0, 0); }
		var r = document.createRange(); r.selectNodeContents(el);
		var rects = r.getClientRects(), now = performance.now() / 1000;
		for (var k = 0; k < rects.length; k++) {
			var b = rects[k], n = Math.min(480, Math.round(b.width * b.height / 28 * val('dust'))), dr = val('drift'), dl = val('dustlife');
			for (var i = 0; i < n; i++) grains.push({ x: b.left + Math.random() * b.width, y: b.top + b.height * (.2 + Math.random() * .6), vx: (Math.random() - .5) * 26 * dr, vy: (-14 - Math.random() * 46) * dr, r: (.5 + Math.random() * .9) * val('starsize'), t0: now + Math.random() * .25, life: (1.1 + Math.random() * 1.3) * dl, tw: 4 + Math.random() * 8, ph: Math.random() * 6.2832, stay: Math.random() < .06 });
		}
		if (!draf) draf = requestAnimationFrame(sift);
	}
	function sift(ms) {
		var t = ms / 1000, live = [];
		dc.clearRect(0, 0, W, H); dc.fillStyle = '#fff';
		for (var i = 0; i < grains.length; i++) {
			var g = grains[i], age = t - g.t0;
			if (age < 0) { live.push(g); continue; }
			var k = age / g.life, x = g.x + g.vx * age, y = g.y + g.vy * age - 6 * val('drift') * age * age;
			if (k >= 1) { if (g.stay && born.length < 240) born.push({ x: x / W, y: y / H, r: g.r, a: .55, tw: .6 + Math.random(), ph: g.ph }); continue; }
			dc.globalAlpha = Math.min(1, val('shine') * (1 - k) * (1 - k) * (0.65 + 0.35 * Math.sin(age * g.tw + g.ph)));
			dc.beginPath(); dc.arc(x, y, g.r * (1 - k * .4), 0, 6.2832); dc.fill();
			live.push(g);
		}
		dc.globalAlpha = 1; grains = live;
		draf = grains.length ? requestAnimationFrame(sift) : 0;
		if (!draf) draw(t);
	}
	function loop(ms) { if (ms - last > 50) { last = ms; draw(ms / 1000); } raf = requestAnimationFrame(loop); }
	window.addEventListener('resize', size);
	size();
	if (!REDUCED) {
		raf = requestAnimationFrame(loop);
		document.addEventListener('visibilitychange', function () { cancelAnimationFrame(raf); if (!document.hidden) raf = requestAnimationFrame(loop); });
	}

	if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) window.addEventListener('load', function () { navigator.serviceWorker.register('/service-worker.js').catch(function () {}); });
	})();
	</script>
</body>
</html>
