<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>ephemeral list</title>
	<meta name="description" content="an ephemeral list">
	<meta name="theme-color" content="#0d1424">
	<meta name="color-scheme" content="dark">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="ephemeral">
	<link rel="icon" href="/icon-192.png" type="image/png">
	<link rel="apple-touch-icon" href="/icon-192.png">
	<link rel="manifest" href="/manifest.json">
	<style>
	/* every look below reads a variable; the tune panel moves them and keeps them */
	:root { --size: 15; --weight: 300; --line: .6; --check: 15; --row: 40; --corner: 10; --frost: 10; --glass: .05; --hue: 222; --tint: 0; --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
		--night: #0b1120; --edge: rgba(255,255,255,.1); --ink: #eef1f7; --ink-soft: rgba(238,241,247,.42); --accent: hsl(var(--hue) calc(var(--tint) * 1%) 88%); }
	* { box-sizing: border-box; }
	html, body { margin: 0; min-height: 100%; }
	body { background: var(--night); color: var(--ink); font-family: var(--font); font-size: calc(var(--size) * 1px); font-weight: var(--weight); line-height: 1.4; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-tap-highlight-color: transparent; }
	#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
	main { width: min(360px, 100%); margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
	/* the field, the add button and every row are the same thin pane */
	#add { display: flex; gap: 6px; margin-bottom: 4px; position: sticky; top: calc(8px + env(safe-area-inset-top)); z-index: 2; }
	#task, #plus, .item { background: rgba(255,255,255,var(--glass)); border: calc(var(--line) * 1px) solid var(--edge); border-radius: calc(var(--corner) * 1px); backdrop-filter: blur(calc(var(--frost) * 1px)); -webkit-backdrop-filter: blur(calc(var(--frost) * 1px)); color: var(--ink); }
	#task { flex: 1; min-width: 0; height: calc(var(--row) * 1px); padding: 0 14px; font: inherit; }
	#task::placeholder { color: var(--ink-soft); }
	#task:focus-visible, #plus:focus-visible, #tunebtn:focus-visible, .item:has(input:focus-visible) { outline: 1px solid var(--accent); outline-offset: 2px; }
	#plus { width: calc(var(--row) * 1px); height: calc(var(--row) * 1px); flex: none; padding: 0; display: grid; place-items: center; cursor: pointer; }
	#plus svg, #tunebtn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: calc(var(--line) * 1.6); stroke-linecap: round; }
	#plus:hover, .item:hover { background: rgba(255,255,255,calc(var(--glass) + .04)); }
	#plus:active { transform: scale(.95); }
	#list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
	.item { display: flex; transition: opacity .25s, transform .25s, background .15s; }
	.item label { position: relative; display: flex; align-items: center; gap: 12px; flex: 1; min-height: calc(var(--row) * 1px); padding: 8px 14px; cursor: pointer; }
	.item input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
	/* the check: a hairline box, then a filled one with the mark drawn in */
	.box { flex: none; width: calc(var(--check) * 1px); height: calc(var(--check) * 1px); border: calc(var(--line) * 1px) solid rgba(238,241,247,.5); border-radius: 30%; display: grid; place-items: center; transition: background .2s, border-color .2s; }
	.box svg { width: 70%; height: 70%; stroke: var(--night); stroke-width: calc(var(--line) * 2.4); stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .22s ease-out .05s; }
	.text { flex: 1; min-width: 0; overflow-wrap: anywhere; text-decoration: line-through transparent; text-decoration-thickness: calc(var(--line) * 1px); transition: color .25s, text-decoration-color .25s; }
	.item.done .box { background: var(--accent); border-color: var(--accent); }
	.item.done .box svg { stroke-dashoffset: 0; }
	.item.done .text { color: var(--ink-soft); text-decoration-color: var(--ink-soft); }
	.item.gone { opacity: 0; transform: translateX(24px); }
	.item.dragging { opacity: .4; }
	.item[draggable="true"] { cursor: grab; }
	/* tune: a faint mark in the corner, and the panel it opens */
	#tunebtn { position: fixed; z-index: 4; top: calc(10px + env(safe-area-inset-top)); right: 10px; width: 36px; height: 36px; display: grid; place-items: center; border: 0; padding: 0; background: none; color: var(--ink); opacity: .3; border-radius: 50%; cursor: pointer; transition: opacity .15s; }
	#tunebtn circle { fill: var(--night); }
	#tunebtn:hover, #tunebtn[aria-expanded="true"] { opacity: .85; }
	#tune { position: fixed; z-index: 5; top: calc(52px + env(safe-area-inset-top)); right: 12px; width: 260px; max-height: calc(100dvh - 64px); overflow: auto; padding: 10px 14px 14px; background: rgba(16,22,38,.84); border: 1px solid var(--edge); border-radius: 12px; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); font: 300 12px/1.3 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
	#tune[hidden] { display: none; }
	#tune label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 5px 0; color: var(--ink-soft); }
	#tune output { color: var(--ink); font-variant-numeric: tabular-nums; }
	#tune input { grid-column: 1 / -1; width: 100%; margin: 4px 0 0; -webkit-appearance: none; appearance: none; height: 16px; background: none; cursor: pointer; }
	#tune input::-webkit-slider-runnable-track { height: 1px; background: rgba(255,255,255,.2); }
	#tune input::-moz-range-track { height: 1px; background: rgba(255,255,255,.2); }
	#tune input::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -5px; border-radius: 50%; background: var(--ink); border: 0; }
	#tune input::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--ink); border: 0; }
	#tune input:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
	.seg { display: flex; gap: 4px; padding: 4px 0; }
	.seg button, #reset { flex: 1; height: 28px; border: 1px solid var(--edge); border-radius: 7px; background: none; color: var(--ink-soft); font: inherit; cursor: pointer; }
	.seg button[aria-pressed="true"] { color: var(--ink); border-color: rgba(255,255,255,.28); }
	#reset { width: 100%; margin-top: 8px; }
	.seg button:hover, #reset:hover { color: var(--ink); }
	@media (hover: none) {
		/* a thumb reaches the bottom: the field goes last and keeps to the bottom edge */
		main { justify-content: flex-start; padding-top: calc(52px + env(safe-area-inset-top)); }
		#add { order: 2; top: auto; bottom: calc(8px + env(safe-area-inset-bottom)); margin: auto 0 0; }
		#task, #plus { height: 44px; }
		#plus { width: 44px; }
		.item label { min-height: max(44px, calc(var(--row) * 1px)); }
		#tunebtn { width: 44px; height: 44px; }
		#tune { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 70dvh; border-radius: 16px 16px 0 0; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
		#tune input { height: 28px; }
		#tune input::-webkit-slider-thumb { width: 20px; height: 20px; margin-top: -9.5px; }
		#tune input::-moz-range-thumb { width: 20px; height: 20px; }
		.seg button, #reset { height: 38px; }
	}
	@media (prefers-reduced-motion: reduce) { .item, .box, .box svg, .text, #plus, #tunebtn { transition: none; } }
	</style>
</head>
<body>
	<canvas id="sky" aria-hidden="true"></canvas>
	<button id="tunebtn" type="button" aria-label="tune" aria-expanded="false" aria-controls="tune"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h12M2 11h12"/><circle cx="6" cy="5" r="1.6" fill="#0b1120"/><circle cx="10" cy="11" r="1.6" fill="#0b1120"/></svg></button>
	<main>
		<form id="add" autocomplete="off">
			<input id="task" type="text" placeholder="+" aria-label="item" maxlength="140" autocapitalize="sentences" enterkeyhint="done" autocomplete="off">
			<button id="plus" type="submit" aria-label="add"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
		</form>
		<ul id="list" aria-label="list"></ul>
	</main>
	<section id="tune" aria-label="tune" hidden></section>
	<script>
	(function () {
	'use strict';
	var REDUCED = false, HOVER = false;
	try { REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches; HOVER = matchMedia('(hover: hover)').matches; } catch (e) {}
	var list = document.getElementById('list'), form = document.getElementById('add'), field = document.getElementById('task');

	// ---------- the list: it lives as long as the tab does ----------
	var KEY = 'ephemeral-list';
	function items() { return Array.prototype.map.call(list.querySelectorAll('.item:not(.done)'), function (li) { return li.querySelector('.text').textContent; }); }
	function save() { try { sessionStorage.setItem(KEY, JSON.stringify(items())); } catch (e) {} }
	function add(text) {
		var li = document.createElement('li'); li.className = 'item';
		var label = document.createElement('label');
		var box = document.createElement('input'); box.type = 'checkbox';
		var mark = document.createElement('span'); mark.className = 'box';
		mark.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
		var span = document.createElement('span'); span.className = 'text'; span.textContent = text;
		label.appendChild(box); label.appendChild(mark); label.appendChild(span); li.appendChild(label);
		if (HOVER) li.draggable = true;
		// checked: the mark draws and the line strikes through; a moment later the row leaves.
		// unchecking inside that moment keeps it
		var timer = null;
		box.addEventListener('change', function () {
			li.classList.toggle('done', box.checked);
			clearTimeout(timer);
			if (box.checked) timer = setTimeout(function () {
				li.classList.add('gone');
				setTimeout(function () { li.remove(); save(); }, REDUCED ? 0 : 260);
			}, 1600);
			save();
		});
		list.appendChild(li);
		return li;
	}
	form.addEventListener('submit', function (e) {
		e.preventDefault();
		var t = field.value.trim();
		if (!t) return;
		add(t);
		field.value = '';
		field.focus();
		save();
	});
	try { (JSON.parse(sessionStorage.getItem(KEY)) || []).forEach(add); } catch (e) {}
	save();
	// a keyboard is already there on a desk; on a phone the keyboard waits for a tap
	if (HOVER) field.focus();


	// ---------- tune: sliders over the variables in :root, kept in this browser ----------
	var TUNE = [['text', 'size', 12, 22, 1, 'px'], ['weight', 'weight', 100, 600, 50, ''], ['line', 'line', .25, 2, .05, 'px'], ['check', 'check', 10, 26, 1, 'px'], ['row', 'row', 30, 64, 2, 'px'], ['corners', 'corner', 0, 28, 1, 'px'], ['frost', 'frost', 0, 40, 1, 'px'], ['glass', 'glass', 0, .3, .01, ''], ['colour', 'hue', 0, 360, 2, ''], ['tint', 'tint', 0, 100, 5, '']];
	var FONTS = { sans: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif", serif: "ui-serif, 'New York', 'Iowan Old Style', Georgia, serif", round: "ui-rounded, 'SF Pro Rounded', system-ui, sans-serif", mono: "ui-monospace, 'SF Mono', Menlo, monospace" };
	var TK = 'ls-tune2', root = document.documentElement, base = getComputedStyle(root), DEF = {}, tuned = {};
	TUNE.forEach(function (r) { DEF[r[1]] = parseFloat(base.getPropertyValue('--' + r[1])); });
	DEF.font = 'sans';
	try { tuned = JSON.parse(localStorage.getItem(TK)) || {}; } catch (e) {}
	function val(k) { return k in tuned ? tuned[k] : DEF[k]; }
	function apply() { TUNE.forEach(function (r) { root.style.setProperty('--' + r[1], val(r[1])); }); root.style.setProperty('--font', FONTS[val('font')] || FONTS.sans); }
	function keep() { try { localStorage.setItem(TK, JSON.stringify(tuned)); } catch (e) {} }
	apply();
	var panel = document.getElementById('tune'), btn = document.getElementById('tunebtn');
	function build() {
		panel.innerHTML = '';
		var seg = document.createElement('div'); seg.className = 'seg'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', 'font');
		Object.keys(FONTS).forEach(function (f) {
			var b = document.createElement('button'); b.type = 'button'; b.textContent = f; b.style.fontFamily = FONTS[f];
			b.setAttribute('aria-pressed', val('font') === f);
			b.addEventListener('click', function () { tuned.font = f; apply(); keep(); seg.querySelectorAll('button').forEach(function (o) { o.setAttribute('aria-pressed', o === b); }); });
			seg.appendChild(b);
		});
		panel.appendChild(seg);
		TUNE.forEach(function (r) {
			var l = document.createElement('label'), o = document.createElement('output'), i = document.createElement('input');
			i.type = 'range'; i.min = r[2]; i.max = r[3]; i.step = r[4]; i.value = val(r[1]);
			function show() { o.textContent = +(+i.value).toFixed(2) + r[5]; }
			show();
			i.addEventListener('input', function () { tuned[r[1]] = +i.value; apply(); show(); });
			i.addEventListener('change', keep);
			l.appendChild(document.createTextNode(r[0])); l.appendChild(o); l.appendChild(i); panel.appendChild(l);
		});
		var reset = document.createElement('button'); reset.id = 'reset'; reset.type = 'button'; reset.textContent = 'reset';
		reset.addEventListener('click', function () { tuned = {}; keep(); apply(); build(); reset = panel.querySelector('#reset'); reset && reset.focus(); });
		panel.appendChild(reset);
	}
	function open(on) {
		if (on === panel.hidden) { if (on) build(); panel.hidden = !on; btn.setAttribute('aria-expanded', on); (on ? panel.querySelector('button') : btn).focus(); }
	}
	btn.addEventListener('click', function () { open(panel.hidden); });
	document.addEventListener('keydown', function (e) {
		if (e.key === 'Escape' && !panel.hidden) open(false);
		else if (e.key === ',' && document.activeElement !== field && !e.metaKey && !e.ctrlKey) { e.preventDefault(); open(panel.hidden); }
	});
	document.addEventListener('pointerdown', function (e) { if (!panel.hidden && !panel.contains(e.target) && !btn.contains(e.target)) open(false); });

	// ---------- reorder by dragging, where there is a mouse ----------
	var dragging = null;
	list.addEventListener('dragstart', function (e) {
		dragging = e.target.closest ? e.target.closest('.item') : null;
		if (!dragging) return;
		dragging.classList.add('dragging');
		e.dataTransfer.effectAllowed = 'move';
		e.dataTransfer.setData('text/plain', dragging.querySelector('.text').textContent);
	});
	list.addEventListener('dragend', function () { if (dragging) dragging.classList.remove('dragging'); dragging = null; save(); });
	list.addEventListener('dragover', function (e) {
		if (!dragging) return;
		e.preventDefault();
		var kids = list.querySelectorAll('.item:not(.dragging)'), after = null;
		for (var i = 0; i < kids.length; i++) { var b = kids[i].getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) { after = kids[i]; break; } }
		if (after) list.insertBefore(dragging, after); else list.appendChild(dragging);
	});

	// ---------- the sky: stars on one canvas, twinkling off the clock ----------
	var sky = document.getElementById('sky'), sc = sky.getContext('2d'), stars = [], W = 0, H = 0;
	for (var i = 0; i < 420; i++) stars.push({ x: Math.random(), y: Math.random(), r: Math.random() < .3 ? 1.2 : .7, a: .35 + Math.random() * .5, tw: Math.random() < .5 ? .6 + Math.random() * 1.2 : 0, ph: Math.random() * 6.2832 });
	function size() {
		var dpr = Math.min(window.devicePixelRatio || 1, 2);
		W = window.innerWidth; H = window.innerHeight;
		sky.width = Math.round(W * dpr); sky.height = Math.round(H * dpr);
		sc.setTransform(dpr, 0, 0, dpr, 0, 0);
		draw(performance.now() / 1000);
	}
	function draw(t) {
		sc.clearRect(0, 0, W, H);
		sc.fillStyle = '#fff';
		// about one star per 6000 square px, whatever the screen
		var n = Math.min(stars.length, Math.round(W * H / 6000));
		for (var i = 0; i < n; i++) {
			var s = stars[i];
			sc.globalAlpha = s.tw && !REDUCED ? s.a * (0.6 + 0.4 * Math.sin(t * s.tw + s.ph)) : s.a;
			sc.beginPath(); sc.arc(s.x * W, s.y * H, s.r, 0, 6.2832); sc.fill();
		}
		sc.globalAlpha = 1;
	}
	var raf = 0, last = 0;
	function loop(ms) { if (ms - last > 50) { last = ms; draw(ms / 1000); } raf = requestAnimationFrame(loop); }
	window.addEventListener('resize', size);
	size();
	if (!REDUCED) {
		raf = requestAnimationFrame(loop);
		document.addEventListener('visibilitychange', function () { cancelAnimationFrame(raf); if (!document.hidden) raf = requestAnimationFrame(loop); });
	}

	if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) window.addEventListener('load', function () { navigator.serviceWorker.register('/service-worker.js').catch(function () {}); });
	})();
	</script>
</body>
</html>
