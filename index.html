<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>ephemeral list</title>
	<meta name="description" content="an ephemeral list">
	<meta name="theme-color" content="#0d1424">
	<meta name="color-scheme" content="dark">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="ephemeral">
	<link rel="icon" href="/icon-192.png" type="image/png">
	<link rel="apple-touch-icon" href="/icon-192.png">
	<link rel="manifest" href="/manifest.json">
	<style>
	:root { --night: #0d1424; --panel: rgba(28,34,52,.62); --edge: rgba(255,255,255,.09); --ink: #f2f4f8; --ink-soft: rgba(242,244,248,.5); --accent: #8fb0ff; }
	* { box-sizing: border-box; }
	html, body { margin: 0; min-height: 100%; }
	body { background: var(--night); color: var(--ink); font: 17px/1.35 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
	#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
	main { width: min(460px, 100%); margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: calc(32px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
	header { display: flex; align-items: baseline; justify-content: space-between; padding: 0 6px; }
	h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -.02em; color: var(--accent); }
	#count { font-size: 28px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
	.group { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); overflow: hidden; }
	#list { list-style: none; margin: 0; padding: 0; }
	/* a hairline between rows, starting where the text starts */
	.item, #add { position: relative; }
	.item + .item::before, #list:not(:empty) + #add::before { content: ''; position: absolute; top: 0; left: 52px; right: 0; height: 1px; background: var(--edge); }
	.item { display: flex; transition: opacity .25s, transform .25s; }
	.item label { position: relative; display: flex; align-items: center; gap: 14px; flex: 1; min-height: 50px; padding: 12px 16px; cursor: pointer; }
	.item input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
	/* the check: a ring, then a filled circle with the mark drawn in */
	.box { flex: none; width: 22px; height: 22px; border: 1.5px solid rgba(242,244,248,.38); border-radius: 50%; display: grid; place-items: center; transition: background .2s, border-color .2s, transform .2s; }
	.item label:hover .box { border-color: var(--accent); }
	.box svg { width: 12px; height: 12px; stroke: var(--night); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .22s ease-out .05s; }
	.text { flex: 1; min-width: 0; overflow-wrap: anywhere; transition: color .25s; }
	.item.done .box { background: var(--accent); border-color: var(--accent); transform: scale(1.06); }
	.item.done .box svg { stroke-dashoffset: 0; }
	.item.done .text { color: var(--ink-soft); }
	.item.gone { opacity: 0; transform: translateX(24px); }
	.item.dragging { opacity: .4; }
	.item[draggable="true"] { cursor: grab; }
	.item:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 14px; }
	#add { display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 0 16px; }
	#plus { flex: none; width: 22px; height: 22px; border: 0; border-radius: 50%; padding: 0; background: var(--accent); color: var(--night); font: 600 18px/22px system-ui, sans-serif; cursor: pointer; display: grid; place-items: center; }
	#plus::after { content: ''; position: absolute; width: 44px; height: 44px; }
	#plus:active { transform: scale(.9); }
	#plus:focus-visible, #task:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
	#task { flex: 1; min-width: 0; height: 50px; border: 0; background: none; color: var(--ink); font: inherit; padding: 0; }
	#task:focus-visible { outline: none; }
	#task::placeholder { color: var(--ink-soft); }
	@media (hover: none) {
		/* a phone: the title at the top, the list under it, the field a bar at the thumb */
		main { justify-content: flex-start; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
		h1 { font-size: 34px; }
		/* a blur here would make the group the box the fixed bar sits in */
		.group { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(28,34,52,.86); }
		.group:has(#list:empty) { border: 0; }
		#add { position: fixed; left: 0; right: 0; bottom: 0; min-height: 0; padding: 10px 20px calc(10px + env(safe-area-inset-bottom)); background: rgba(13,20,36,.72); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); border-top: 1px solid var(--edge); }
		#add::before { display: none; }
		#plus { width: 30px; height: 30px; font-size: 22px; line-height: 30px; }
		#task { height: 44px; padding: 0 14px; border-radius: 22px; background: rgba(255,255,255,.08); }
	}
	@media (prefers-reduced-motion: reduce) { .item, .box, .box svg, .text, #plus { transition: none; } }
	</style>
</head>
<body>
	<canvas id="sky" aria-hidden="true"></canvas>
	<main>
		<header><h1>list</h1><span id="count" aria-label="open"></span></header>
		<div class="group">
			<ul id="list" aria-label="list"></ul>
			<form id="add" autocomplete="off">
				<button id="plus" type="submit" aria-label="add">+</button>
				<input id="task" type="text" placeholder="new" aria-label="item" maxlength="140" autocapitalize="sentences" enterkeyhint="done" autocomplete="off">
			</form>
		</div>
	</main>
	<script>
	(function () {
	'use strict';
	var REDUCED = false, HOVER = false;
	try { REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches; HOVER = matchMedia('(hover: hover)').matches; } catch (e) {}
	var list = document.getElementById('list'), form = document.getElementById('add'), field = document.getElementById('task');

	// ---------- the list: it lives as long as the tab does ----------
	var KEY = 'ephemeral-list';
	function items() { return Array.prototype.map.call(list.querySelectorAll('.item:not(.done)'), function (li) { return li.querySelector('.text').textContent; }); }
	function save() { var n = items().length; document.getElementById('count').textContent = n || ''; try { sessionStorage.setItem(KEY, JSON.stringify(items())); } catch (e) {} }
	function add(text) {
		var li = document.createElement('li'); li.className = 'item';
		var label = document.createElement('label');
		var box = document.createElement('input'); box.type = 'checkbox';
		var mark = document.createElement('span'); mark.className = 'box';
		mark.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
		var span = document.createElement('span'); span.className = 'text'; span.textContent = text;
		label.appendChild(box); label.appendChild(mark); label.appendChild(span); li.appendChild(label);
		if (HOVER) li.draggable = true;
		// checked: the mark draws and the line strikes through; a moment later the row leaves.
		// unchecking inside that moment keeps it
		var timer = null;
		box.addEventListener('change', function () {
			li.classList.toggle('done', box.checked);
			clearTimeout(timer);
			if (box.checked) timer = setTimeout(function () {
				li.classList.add('gone');
				setTimeout(function () { li.remove(); save(); }, REDUCED ? 0 : 260);
			}, 1600);
			save();
		});
		list.appendChild(li);
		return li;
	}
	form.addEventListener('submit', function (e) {
		e.preventDefault();
		var t = field.value.trim();
		if (!t) return;
		add(t);
		field.value = '';
		field.focus();
		save();
	});
	try { (JSON.parse(sessionStorage.getItem(KEY)) || []).forEach(add); } catch (e) {}
	save();
	// a keyboard is already there on a desk; on a phone the keyboard waits for a tap
	if (HOVER) field.focus();

	// ---------- reorder by dragging, where there is a mouse ----------
	var dragging = null;
	list.addEventListener('dragstart', function (e) {
		dragging = e.target.closest ? e.target.closest('.item') : null;
		if (!dragging) return;
		dragging.classList.add('dragging');
		e.dataTransfer.effectAllowed = 'move';
		e.dataTransfer.setData('text/plain', dragging.querySelector('.text').textContent);
	});
	list.addEventListener('dragend', function () { if (dragging) dragging.classList.remove('dragging'); dragging = null; save(); });
	list.addEventListener('dragover', function (e) {
		if (!dragging) return;
		e.preventDefault();
		var kids = list.querySelectorAll('.item:not(.dragging)'), after = null;
		for (var i = 0; i < kids.length; i++) { var b = kids[i].getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) { after = kids[i]; break; } }
		if (after) list.insertBefore(dragging, after); else list.appendChild(dragging);
	});

	// ---------- the sky: stars on one canvas, twinkling off the clock ----------
	var sky = document.getElementById('sky'), sc = sky.getContext('2d'), stars = [], W = 0, H = 0;
	for (var i = 0; i < 420; i++) stars.push({ x: Math.random(), y: Math.random(), r: Math.random() < .3 ? 1.2 : .7, a: .35 + Math.random() * .5, tw: Math.random() < .5 ? .6 + Math.random() * 1.2 : 0, ph: Math.random() * 6.2832 });
	function size() {
		var dpr = Math.min(window.devicePixelRatio || 1, 2);
		W = window.innerWidth; H = window.innerHeight;
		sky.width = Math.round(W * dpr); sky.height = Math.round(H * dpr);
		sc.setTransform(dpr, 0, 0, dpr, 0, 0);
		draw(performance.now() / 1000);
	}
	function draw(t) {
		sc.clearRect(0, 0, W, H);
		sc.fillStyle = '#fff';
		// about one star per 6000 square px, whatever the screen
		var n = Math.min(stars.length, Math.round(W * H / 6000));
		for (var i = 0; i < n; i++) {
			var s = stars[i];
			sc.globalAlpha = s.tw && !REDUCED ? s.a * (0.6 + 0.4 * Math.sin(t * s.tw + s.ph)) : s.a;
			sc.beginPath(); sc.arc(s.x * W, s.y * H, s.r, 0, 6.2832); sc.fill();
		}
		sc.globalAlpha = 1;
	}
	var raf = 0, last = 0;
	function loop(ms) { if (ms - last > 50) { last = ms; draw(ms / 1000); } raf = requestAnimationFrame(loop); }
	window.addEventListener('resize', size);
	size();
	if (!REDUCED) {
		raf = requestAnimationFrame(loop);
		document.addEventListener('visibilitychange', function () { cancelAnimationFrame(raf); if (!document.hidden) raf = requestAnimationFrame(loop); });
	}

	if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) window.addEventListener('load', function () { navigator.serviceWorker.register('/service-worker.js').catch(function () {}); });
	})();
	</script>
</body>
</html>
